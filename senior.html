<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting… | ABI Parent Care</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml" />
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var requestId = String(params.get("request") || "").trim();
        var next = requestId
          ? "needs-action.html?request=" + encodeURIComponent(requestId)
          : "index.html";
        window.location.replace(
          "admin/login.html?next=" + encodeURIComponent(next)
        );
      })();
    </script>
  </head>
  <body>
    <p>This page has moved to the staff portal. Redirecting to login…</p>
    <p><a href="admin/login.html">Continue to staff login</a></p>
  </body>
</html>
